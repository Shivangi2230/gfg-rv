
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎮 Rock Paper Scissors</h1>

    <div class="choices">
        <button onclick="play('rock')">🪨 Rock</button>
        <button onclick="play('paper')">📄 Paper</button>
        <button onclick="play('scissors')">✂️ Scissors</button>
    </div>

    <div class="result">
        <p><strong>Your Choice:</strong> <span id="userChoice">-</span></p>
        <p><strong>Computer Choice:</strong> <span id="computerChoice">-</span></p>
        <h2 id="winner">Choose an option!</h2>
    </div>

    <div class="score">
        <h3>Score</h3>
        <p>You: <span id="userScore">0</span></p>
        <p>Computer: <span id="computerScore">0</span></p>
    </div>

    <button id="reset" onclick="resetGame()">Reset Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
